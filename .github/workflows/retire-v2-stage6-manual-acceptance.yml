name: RETIRE V2 Stage 6 manual acceptance

# Temporary M12 integration verification; restore after one run.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/neon-stage6-db-reconnect-20261105
    paths:
      - .github/workflows/retire-v2-stage6-manual-acceptance.yml

permissions:
  contents: read

concurrency:
  group: retire-v2-stage6-manual-acceptance
  cancel-in-progress: false

jobs:
  focused-acceptance:
    name: M12 workspace integration and PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_ENV: test
      STAGE6_PREVIEW_ENABLED: "0"
      SCENARIO_TEST_POSTGRES_URL: postgresql+psycopg2://postgres:retire_v2_ci_only@127.0.0.1:5432/retire_v2_scenario_test
      DATABASE_URL: postgresql+psycopg2://postgres:retire_v2_ci_only@127.0.0.1:5432/retire_v2_scenario_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: retire_v2_ci_only
          POSTGRES_DB: retire_v2_scenario_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d retire_v2_scenario_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout triggering ref
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate isolated test runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ENV" = test
          test "$STAGE6_PREVIEW_ENABLED" = 0
          test "$GITHUB_REF_TYPE" = branch
          test "$GITHUB_REF_NAME" = feature/neon-stage6-db-reconnect-20261105
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          for name in ("DATABASE_URL", "SCENARIO_TEST_POSTGRES_URL"):
              url = urlsplit(os.environ[name].replace("postgresql+psycopg2://", "postgresql://", 1))
              assert url.hostname == "127.0.0.1" and url.path == "/retire_v2_scenario_test"
          PY
          mkdir -p acceptance-evidence

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install existing backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Verify PostgreSQL 16 and isolated database
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee acceptance-evidence/postgresql-version.txt
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["SCENARIO_TEST_POSTGRES_URL"])
          try:
              with engine.connect() as connection:
                  version = connection.scalar(text("SHOW server_version"))
                  dbname = connection.scalar(text("SELECT current_database()"))
                  print(f"PostgreSQL server_version={version} database={dbname}")
                  assert version.startswith("16.")
                  assert dbname == "retire_v2_scenario_test"
          finally:
              engine.dispose()
          PY

      - name: M12 PDF regression, compact pagination and formatting
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -v tests/test_m12_draft_report.py --junitxml="../acceptance-evidence/m12-junit.xml" 2>&1 | tee ../acceptance-evidence/m12-backend.log
          python -m pip install -q pymupdf
          python - <<'PY'
          from pathlib import Path
          import fitz
          source = Path("../acceptance-evidence/m12-updated-multipage-synthetic.pdf")
          document = fitz.open(source)
          pages = len(document)
          print(f"M12_PDF_PAGE_COUNT={pages}")
          assert pages >= 2, f"Expected multipage report; got {pages}"
          path = Path("../acceptance-evidence/m12-pages")
          path.mkdir(parents=True, exist_ok=True)
          for number, page in enumerate(document):
              if number >= 4:
                  break
              page.get_pixmap(matrix=fitz.Matrix(1.6,1.6)).save(path / f"page-{number+1}.png")
          PY


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install existing frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: M12 workspace integration and existing workspace regression
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm test -- src/pages/RetirementWorkspaceScreen.test.tsx src/components/M12DraftReportPanel.test.tsx --reporter=default 2>&1 | tee ../acceptance-evidence/m12-frontend.log
          npm run build 2>&1 | tee ../acceptance-evidence/m12-build.log

      - name: Save JUnit and test logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retire-v2-stage6-acceptance-${{ github.run_id }}
          path: acceptance-evidence/
          if-no-files-found: warn
          retention-days: 7
